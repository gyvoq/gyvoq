<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobrinha</title>
<style>
:root{
  --bg:#000;--text:#e8e8e8;--dim:#8a8a8a;--dot:#2a2a2a;--blue:#2f6bdb;--panel:rgba(0,0,0,.78);--chip:#1c1c1c;
}
@media (prefers-color-scheme:light){
  :root{--bg:#fff;--text:#161616;--dim:#6b6b6b;--dot:#d6d6d6;--blue:#2457c5;--panel:rgba(255,255,255,.85);--chip:#ececec}
}
*,*:before,*:after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;overflow:hidden;touch-action:none;
}
.top{width:min(92vw,560px);display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:600}
.top span{color:var(--dim);font-weight:400;font-size:15px}
.top b{color:var(--text)}
.wrap{position:relative;width:min(92vw,560px,70vh);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--panel);text-align:center;padding:20px}
.msg.hide{display:none}
.msg h1{margin:0;font-size:24px}
.msg p{margin:0;color:var(--dim);font-size:15px}
.speed{display:flex;flex-direction:column;gap:8px;align-items:center}
.levels{display:flex;gap:8px}
.levels button{width:42px;height:42px;border-radius:50%;background:var(--chip);color:var(--text);padding:0;font-size:16px}
.levels button.on{background:var(--blue);color:#fff}
button{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:600;cursor:pointer}
button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.hint{color:var(--dim);font-size:14px;text-align:center;padding:0 12px}

@media (max-width:700px){
  body{gap:18px}
  .top{width:98vw;font-size:22px;padding:0 4px}
  .top span{font-size:17px}
  .wrap{width:min(98vw,78vh)}
  .msg h1{font-size:32px}
  .msg p{font-size:18px}
  .levels{gap:10px}
  .levels button{width:54px;height:54px;font-size:20px}
  button{padding:16px 40px;font-size:20px}
  .hint{font-size:16px}
}
</style>
</head>
<body>
<div class="top">
  <div>Criando imagem</div>
  <span>Pontos: <b id="score">0</b> · Recorde: <b id="best">0</b></span>
</div>

<div class="wrap">
  <canvas id="c"></canvas>
  <div class="msg" id="msg">
    <h1 id="mt">Cobrinha</h1>
    <p id="mp">Setas, WASD ou deslize na tela</p>
    <div class="speed">
      <p>Velocidade</p>
      <div class="levels" id="levels">
        <button data-s="1">1</button>
        <button data-s="2">2</button>
        <button data-s="3">3</button>
        <button data-s="4">4</button>
        <button data-s="5">5</button>
      </div>
    </div>
    <button id="go" class="play">Jogar</button>
  </div>
</div>

<div class="hint">Espaço pausa · teclas 1 a 5 mudam a velocidade</div>
<script>
(function () {
  var N = 20;



  var SPEEDS = { 1: 200, 2: 150, 3: 110, 4: 80, 5: 55 };

  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var msg = document.getElementById('msg'), mt = document.getElementById('mt'), mp = document.getElementById('mp');
  var goBtn = document.getElementById('go');
  var sEl = document.getElementById('score'), bEl = document.getElementById('best');
  var levelBtns = document.querySelectorAll('#levels button');

  var snake, dir, next, food, score, timer;
  var best = 0, level = 3, running = false, paused = false, size = 0;

  try {
    best = parseInt(localStorage.getItem('cobrinha-best')) || 0;
    level = parseInt(localStorage.getItem('cobrinha-speed')) || 3;
  } catch (e) {}
  bEl.textContent = best;

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function setLevel(n) {
    if (!SPEEDS[n]) return;
    level = n;
    levelBtns.forEach(function (b) { b.classList.toggle('on', +b.dataset.s === n); });
    try { localStorage.setItem('cobrinha-speed', n); } catch (e) {}
    if (running && !paused) { clearInterval(timer); timer = setInterval(step, SPEEDS[level]); }
  }

  function resize() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    size = cv.width / N; draw();
  }

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; next = dir; score = 0; sEl.textContent = 0; placeFood();
  }

  function placeFood() {
    var p;
    do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(function (s) { return s.x === p.x && s.y === p.y; }));
    food = p;
  }

  function step() {
    dir = next;
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var eat = h.x === food.x && h.y === food.y;
    var body = eat ? snake : snake.slice(0, -1);
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N ||
        body.some(function (s) { return s.x === h.x && s.y === h.y; })) return over();
    snake.unshift(h);
    if (eat) {
      score++; sEl.textContent = score; placeFood();
      if (score > best) {
        best = score; bEl.textContent = best;
        try { localStorage.setItem('cobrinha-best', best); } catch (e) {}
      }
    } else snake.pop();
    draw();
  }

  function over() {
    running = false; clearInterval(timer);
    mt.textContent = 'Fim de jogo';
    mp.textContent = 'Você fez ' + score + ' ponto' + (score === 1 ? '' : 's') + '.';
    goBtn.textContent = 'Jogar de novo';
    msg.classList.remove('hide');
  }

  function draw() {
    if (!snake) return;
    var dot = css('--dot'), blue = css('--blue');
    ctx.clearRect(0, 0, cv.width, cv.height);

    ctx.fillStyle = dot;
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      ctx.beginPath(); ctx.arc((x + .5) * size, (y + .5) * size, size * .06, 0, 6.283); ctx.fill();
    }

    ctx.fillStyle = blue;
    var pulse = .28 + Math.sin(Date.now() / 300) * .04;
    ctx.beginPath(); ctx.arc((food.x + .5) * size, (food.y + .5) * size, size * pulse, 0, 6.283); ctx.fill();

    var L = snake.length;
    for (var i = L - 1; i >= 0; i--) {
      var s = snake[i], k = i / Math.max(L - 1, 1);
      var rad = size * (i === 0 ? .4 : .38 - k * .2);
      ctx.beginPath(); ctx.arc((s.x + .5) * size, (s.y + .5) * size, Math.max(rad, size * .1), 0, 6.283); ctx.fill();
    }

    var hd = snake[0], cx = (hd.x + .5) * size, cy = (hd.y + .5) * size, px = -dir.y, py = dir.x;
    ctx.fillStyle = '#fff';
    [-1, 1].forEach(function (sd) {
      ctx.beginPath();
      ctx.arc(cx + dir.x * size * .12 + px * sd * size * .13, cy + dir.y * size * .12 + py * sd * size * .13, size * .055, 0, 6.283);
      ctx.fill();
    });
  }

  function start() {
    reset(); running = true; paused = false;
    msg.classList.add('hide');
    clearInterval(timer); timer = setInterval(step, SPEEDS[level]); draw();
  }

  function turn(x, y) {
    if (!running || paused) return;
    if (x === -dir.x && y === -dir.y) return;
    next = { x: x, y: y };
  }

  goBtn.onclick = start;
  levelBtns.forEach(function (b) { b.onclick = function () { setLevel(+b.dataset.s); }; });

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    var m = { arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0] };
    if (m[k]) { e.preventDefault(); turn(m[k][0], m[k][1]); }
    else if (k >= '1' && k <= '5') setLevel(+k);
    else if (e.key === ' ') {
      e.preventDefault();
      if (!running) { start(); return; }
      paused = !paused;
      if (paused) {
        clearInterval(timer);
        mt.textContent = 'Pausado'; mp.textContent = 'Aperte espaço para continuar';
        goBtn.style.display = 'none'; msg.classList.remove('hide');
      } else {
        msg.classList.add('hide'); goBtn.style.display = '';
        timer = setInterval(step, SPEEDS[level]);
      }
    }
  });

  var tx, ty;
  document.body.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  document.body.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    tx = null;
  }, { passive: true });

  window.addEventListener('resize', resize);
  setLevel(level); reset(); resize();
  setInterval(function () { if (!running) draw(); }, 60);
})();
</script>
</body>
</html>
