<style>
:root{--bg:#07050C;--panel:#110C1C;--line:#2A1F42;--ink:#F4F0FB;--mute:#A99FC0;--p:#8B5CF6;--p2:#B79BFF;--font:"Inter",system-ui,-apple-system,sans-serif;--gap:24px;--pad:clamp(18px,4vw,32px)}
html{scroll-behavior:smooth;scroll-padding-top:76px;color-scheme:dark;background:var(--bg);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 clamp(16px,1.2vw + 12px,18px)/1.7 var(--font);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--p2);outline-offset:3px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 var(--pad)}
header{position:sticky;top:0;z-index:10;background:rgba(7,5,12,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-weight:600;font-size:20px;letter-spacing:.04em}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;gap:6px}
.lang button{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--mute);font:600 13px var(--font);cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.lang button:hover{border-color:var(--p);color:var(--ink)}
.lang button[aria-pressed=true]{border-color:var(--p);background:rgba(139,92,246,.18);color:var(--ink)}
.lang svg{width:22px;height:15px;border-radius:3px;display:block;flex:none}
nav{display:flex;gap:6px;font-weight:600;font-size:15px;color:var(--mute)}
nav a{padding:10px 14px;border-radius:999px;min-height:44px;display:flex;align-items:center}
nav a:hover{color:var(--p2);background:rgba(139,92,246,.12)}
.hero{min-height:calc(100svh - 64px);min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:64px var(--pad)}
h1{font-weight:600;font-size:clamp(56px,17vw,176px);line-height:.95;letter-spacing:-.04em;margin:0;background:linear-gradient(180deg,#fff 30%,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-weight:600;font-size:clamp(12px,3.2vw,15px);letter-spacing:.3em;color:var(--p2);margin:22px 0 14px}
.tag{max-width:46ch;color:var(--mute);font-size:clamp(16px,2.4vw,20px);margin:0 0 34px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;background:var(--p);color:#fff;padding:0 30px;border-radius:999px;border:1.5px solid var(--p);font:600 16px var(--font);cursor:pointer;transition:background .2s}
.btn:hover{background:#A07BFF}
.btn.ghost{background:none;color:var(--p2)}
.btn.ghost:hover{background:rgba(139,92,246,.15)}
section{padding:clamp(56px,9vw,100px) 0 0}
h2{font-weight:600;font-size:clamp(30px,5vw,48px);letter-spacing:-.02em;margin:0 0 22px;line-height:1.1}
.about{display:grid;grid-template-columns:1.7fr 1fr;gap:clamp(28px,5vw,56px);align-items:start}
.about p{margin:0 0 14px;color:var(--mute);max-width:62ch}
.stats{display:grid;gap:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
.stat b{display:block;font-weight:600;font-size:clamp(36px,5vw,48px);line-height:1.1;color:var(--p2)}
.stat span{color:var(--mute);font-size:13px;letter-spacing:.12em}
.contact{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(36px,7vw,64px) var(--pad);margin-top:clamp(56px,9vw,100px)}
.contact p{color:var(--mute);margin:0 0 28px}
.contact .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
footer{text-align:center;color:var(--mute);font-size:14px;padding:44px var(--pad) 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;transition:border-color .2s}
.card:hover{border-color:var(--p)}
.vrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);max-width:760px;margin:0 auto var(--gap)}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.vid{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#000}
.vid.v{aspect-ratio:9/16}
.vid.h{aspect-ratio:16/9}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.num{color:var(--p2);font-weight:600;font-size:13px;letter-spacing:.14em;margin:12px 4px 2px}
@media(max-width:720px){
.about{grid-template-columns:1fr}
.stats{grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px 18px}
.vrow{grid-template-columns:1fr;max-width:340px}
.hgrid{grid-template-columns:1fr}
}
@media(max-width:560px){
html{scroll-padding-top:112px}
header .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:6px;row-gap:2px}
.right{display:contents}
.lang{order:2}
nav{order:3;width:100%;justify-content:center}
.lang button{padding:0 10px}
nav a{padding:10px 12px}
.contact .row{flex-direction:column}
.contact .btn{width:100%}
.hero .btn{width:100%;max-width:320px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

function detectLang(){
try{var s=localStorage.getItem("gyvoq-lang");if(s&&T[s])return s}catch(e){}
var l=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
for(var i=0;i<l.length;i++){var c=String(l[i]).toLowerCase().slice(0,2);if(c==="pt")return"pt";if(c==="en")return"en"}
return"pt"}
function setLang(lang,save){
var d=T[lang];
document.documentElement.lang=lang==="pt"?"pt-BR":"en";
document.title=d.title;
document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=d[el.dataset.i18n]});
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang)});
if(save){try{localStorage.setItem("gyvoq-lang",lang)}catch(e){}}}
document.querySelector(".lang").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setLang(b.dataset.lang,true)});
setLang(detectLang(),false);
